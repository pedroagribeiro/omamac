<style>
  :root {
    --bg: #1a1b26; --fg: #a9b1d6; --accent: #7aa2f7;
    /* Omarchy renders the menu in the system monospace font — the same one
       the active theme sets. This is only a fallback for when font.current
       is empty; the script below overrides it with the real theme font. */
    --font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* Omarchy exposes ONE cornerRadius token, shared by the card and its rows,
       and Style.qml declares it 0 by default (on Linux it mirrors Hyprland's
       decoration:rounding). Square is therefore the faithful default. Set this
       to e.g. 8px if you prefer rounded corners — both follow together. */
    --radius: 0px;
    /* Qt's `style: Text.Outline; styleColor: Util.alpha(dimColor, 0.7)` on the
       picker's label and filter lines — dimColor is the theme background. */
    --outline: color-mix(in srgb, var(--bg) 70%, transparent);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-family);
    font-size: 14px;
    color: var(--fg);
    /* Full-viewport scrim behind everything: theme background at 50% alpha. */
    background: color-mix(in srgb, var(--bg) 50%, transparent);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #card {
    /* Set per level by render(). Omarchy special-cases exactly two menus to
       520 and leaves everything else at 300 (Menu.qml:111) — the Font list is
       one of them, because family names are long enough that most of them
       ellipsis away in a 300px card. The clamp is upstream's own
       `panel.width - gapsOut * 2`, with gapsOut 5. */
    width: min(var(--card-w, 300px), calc(100vw - 10px));
    /* Fully opaque — no blur, no translucency. */
    background: var(--bg);
    border: 1px solid var(--fg);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #hdr {
    height: 34px;
    display: flex;
    align-items: center;
    font-size: 16px;
    background: transparent;
    opacity: .58;                 /* placeholder: "<Level>…" */
  }
  #hdr.typed { opacity: 1; }      /* once the user has typed something */
  #list {
    display: flex;
    flex-direction: column;
    gap: var(--row-gap, 3px);
    overflow-y: auto;
    /* Computed per level by render(), so the list can end MID-ROW. Omarchy has
       no scrollbar anywhere in Menu.qml — the affordance is a clipped row
       instead: "a clipped row is what tells the eye there is more below the
       fold, so never come out even on a row boundary" (foldedListHeight).
       The fallback only matters before the first render(). */
    max-height: var(--list-max-h, 400px);
    /* Both spellings: WebKit needs the pseudo-element, and scrollbar-width is
       the standard property. Without these macOS still paints an overlay
       scrollbar over the rows. */
    scrollbar-width: none;
  }
  #list::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .row {
    display: flex;
    align-items: center;
    height: var(--row-h, 50px);
    /* #list is a flex COLUMN, so without this the rows shrink to fit its
       max-height instead of overflowing it — measured at 25px against a
       declared 60px, which silently defeats both the row height and the
       mid-row fold below (nothing overflows, so nothing is ever clipped).
       flex-shrink must stay 0 for the fold to mean anything. */
    flex: 0 0 auto;
    border-radius: var(--radius);
    cursor: default;
    color: var(--fg);
  }
  .row.on {
    background: color-mix(in srgb, var(--fg) 8%, transparent);
    color: var(--accent);         /* icon + label both pick this up via currentColor */
  }
  .icon {
    width: 36px; flex: 0 0 36px;
    margin-left: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--icon-size, 18px);
    line-height: 1;
  }
  .name {
    flex: 1; min-width: 0;
    font-size: var(--name-size, 16px); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-right: 10px;
  }
  #card[hidden] { display: none; }

  /* ------------------------------------------------------------------ *
     Picker levels (Theme and Background): Omarchy's coverflow, not the
     300px card.

     Both levels are ONE component upstream. omarchy.image-picker's manifest
     describes itself as the "Image-grid selector overlay used for
     wallpapers, themes, and any other directory of images", and both
     switchers shell out to the same omarchy-menu-images:

       omarchy-theme-switcher  --print-name --show-labels --filterable ...
       omarchy-theme-bg-switcher                       (neither flag)

     So the only difference between the two levels here is the chrome under
     the strip, exactly as those flags imply — the geometry, the borders and
     the dim are shared.

     Values below are lifted verbatim from ImagePicker.qml (v4.0.2):
     expandedWidth/Height 768x475, sliceWidth/Height 108x432, sliceSpacing
     -30 (the item overlap), skewOffset 28 (the parallelogram cut),
     bottomChromeHeight = showLabels ? (filterable ? 104 : 74)
                                     : (filterable ?  60 : 30).
     One deviation, and it's deliberate: the source has NO `Behavior on
     width` or any animation anywhere in ImagePicker.qml — x/width/height/y
     are plain bindings, so the real picker SNAPS between slice and expanded
     size with no easing. This matches that: no transition is added here.
   * ------------------------------------------------------------------ */
  #cv {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%; height: 100%;
  }
  #cv:not([hidden]) { display: flex; }
  /* The strip positions every item ABSOLUTELY relative to the selected one,
     the way ImagePicker.qml's delegate binds `x` off `relativeIndex`. A
     plain flex row cannot do this: it centres the strip as a whole, so with
     22 themes the selected item drifts far off-centre. Upstream hardcodes
     the carousel width to expandedWidth + 13 slices (1782px) and centres
     within it; using the real viewport width instead keeps the selected
     item dead-centre on any display, which is the intent that constant
     encodes on the screens Omarchy targets. */
  #cvstrip {
    position: relative;
    width: 100%;
    height: 475px;              /* expandedHeight */
    overflow: hidden;
  }
  .cv {
    position: absolute;
    top: 21.5px;                /* (expandedHeight - sliceHeight) / 2 */
    width: 108px;
    height: 432px;
    /* skewOffset: 28 -> top-left x=28, top-right x=100%, bottom-right
       x=100%-28, bottom-left x=0. Same parallelogram on every item,
       expanded or not. */
    clip-path: polygon(28px 0, 100% 0, calc(100% - 28px) 100%, 0 100%);
    cursor: default;
    /* Border, ImagePicker.qml (v4.0.2) verbatim: strokeWidth 1/3px,
       strokeColor foreground-at-28%/accent for unselected/selected. A plain
       CSS `border` would be sliced off at the slanted edges by the
       clip-path above, so instead this element's own background stands in
       for the stroke: --s is the thickness, and .cv-inner (below) clips to
       the same parallelogram inset by --s on every edge, leaving exactly
       that margin of this background visible as a uniform-width outline. */
    --s: 1px;
    background: color-mix(in srgb, var(--fg) 28%, transparent);
    z-index: 50;
  }
  .cv.on {
    top: 0;
    width: 768px;
    height: 475px;
    z-index: 100;
    --s: 3px;
    background: var(--accent);
  }
  .cv-inner {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    /* Same parallelogram as .cv, inset by --s on every edge — the visible
       gap between this clip and .cv's own is the stroke. The skew is only
       28px across a 432–475px height, so insetting both axes by the same
       --s keeps the perpendicular thickness close enough to uniform that
       the discrepancy isn't visible. */
    clip-path: polygon(
      calc(28px + var(--s)) var(--s),
      calc(100% - var(--s)) var(--s),
      calc(100% - 28px - var(--s)) calc(100% - var(--s)),
      var(--s) calc(100% - var(--s))
    );
    /* Neutral placeholder until a data URI arrives — never a broken-image
       box. Lives here (not on .cv) so an item awaiting its preview still
       shows a bordered frame instead of a solid block. */
    background: color-mix(in srgb, var(--fg) 15%, transparent);
  }
  /* ImagePicker.qml lays a `Rectangle { color: Util.alpha(dimColor,
     item.selected ? 0 : 0.42) }` over every slice — the unselected ones
     recede into the scrim and only the centred item reads at full
     brightness. dimColor is the theme background. */
  .cv-inner::after {
    content: "";
    position: absolute;
    inset: 0;
    background: color-mix(in srgb, var(--bg) 42%, transparent);
  }
  .cv.on .cv-inner::after { background: transparent; }
  .cv-img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  /* bottomChromeHeight: the space reserved below the strip. Reserving it
     (rather than letting the label size the column) is what makes the strip
     sit where Omarchy puts it — vertically centred in the height that
     remains above the chrome — instead of shifting up and down as the label
     appears and disappears. */
  #cvchrome {
    flex: 0 0 auto;
    height: var(--chrome, 30px);
    width: 768px;               /* expandedWidth: both lines elide within it */
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }
  #cvlabel, #cvfilter {
    width: 100%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--fg);
    text-shadow:
      -1px -1px 0 var(--outline),  1px -1px 0 var(--outline),
      -1px  1px 0 var(--outline),  1px  1px 0 var(--outline),
       0   -1px 0 var(--outline),  0    1px 0 var(--outline),
      -1px  0   0 var(--outline),  1px  0   0 var(--outline);
  }
  #cvlabel {
    margin-top: 16px;           /* Style.space(16) */
    font-size: 24px;            /* Style.font.display */
    font-weight: 600;           /* Font.DemiBold */
    line-height: 1.15;
  }
  #cvfilter {
    margin-top: 8px;            /* Style.space(8) */
    font-size: 14px;            /* Style.font.title */
    opacity: .85;
  }
  #cvlabel[hidden], #cvfilter[hidden] { display: none; }
</style>

<div id="card">
  <div id="hdr"></div>
  <div id="list"></div>
</div>
<div id="cv" hidden>
  <div id="cvstrip"></div>
  <div id="cvchrome">
    <div id="cvlabel" hidden></div>
    <div id="cvfilter" hidden></div>
  </div>
</div>

<script>
  const DATA = window.OMAMAC || { theme: {}, font: {}, bg: {}, colors: {} };
  const send = (m) => window.webkit?.messageHandlers?.omamac?.postMessage(m);

  if (DATA.colors) {
    const r = document.documentElement.style;
    if (DATA.colors.background) r.setProperty("--bg", DATA.colors.background);
    if (DATA.colors.foreground) r.setProperty("--fg", DATA.colors.foreground);
    if (DATA.colors.accent) r.setProperty("--accent", DATA.colors.accent);
  }

  // Render in whatever monospace font the user has chosen, same as Omarchy.
  // Falls back to a system monospace stack when font.current is empty; the
  // Nerd Font glyphs below simply won't render in that case, which is
  // acceptable and must not break layout.
  if (DATA.font && DATA.font.current) {
    document.documentElement.style.setProperty(
      "--font-family",
      `"${DATA.font.current}", ui-monospace, SFMono-Regular, Menlo, monospace`
    );
  }

  // Nerd Font glyphs for the root-level rows. Sourced verbatim from
  // omarchy v4.0.2's own menu definition
  // (default/omarchy/omarchy-menu.jsonc), stored as \u{} escapes rather
  // than literal PUA characters so a future edit/copy cannot silently
  // blank them (that's exactly what happened to the Font and marker
  // glyphs when they were first typed as literals here). Omarchy also
  // defines U+EBCF for the "Style" parent entry — unused here, since our
  // root level *is* that Style submenu.
  // Theme/Font/Background are verbatim from omarchy-menu.jsonc. Size has no
  // upstream counterpart — Omarchy exposes text size as a CLI command
  // (omarchy-display-text-size), not a menu entry — so U+F034, fa-text-height,
  // is a choice rather than a port. It was picked by parsing the Nerd Font's
  // cmap rather than assumed present: it lives in the same Font Awesome block
  // as the Background glyph, which already renders here.
  // Opacity has no upstream counterpart — Omarchy's ghostty template sets
  // colours only, and its "Transparency" entry toggles the Quickshell bar, not
  // the terminal. U+F042 (fa-adjust, a half-filled circle) was chosen here and
  // verified present by parsing the Nerd Font's cmap, like the Size glyph.
  const ROOT_ICONS = {
    Theme: "\u{f0e0c}", Font: "\u{e659}", Background: "\u{f03e}",
    Applications: "\u{f00a}", Capture: "\u{f030}",
    // U+F011, fa-power-off — verified present in the Nerd Font. omamac's own
    // entry: Omarchy has no equivalent, since nothing there holds a hotkey the
    // way this does.
    Deactivate: "\u{f011}",
    // U+F0493, mdi toggle-switch — verified present.
    Targets: "\u{f0493}",
  };
  // Inside Targets: on and off are the two states of the same switch, so the
  // row's own glyph carries the state instead of the tick used elsewhere. A
  // tick would say "this is the current one" in a list where every row is
  // independently on or off.
  const TARGET_ON = "\u{f205}";   // fa toggle-on
  const TARGET_OFF = "\u{f0ae}";  // fa toggle-off
  // Omarchy's own glyphs, read out of default/omarchy/omarchy-menu.jsonc at
  // v4.0.2: trigger.capture and trigger.capture.screenshot are both U+F030,
  // and every screenrecord row is U+F03D. Both verified present in the Nerd
  // Font by parsing its cmap, the same check the Padding and Blur glyphs got.
  const CAPTURE_ICONS = {
    Screenshot: "\u{f030}", Record: "\u{f03d}", "Stop Recording": "\u{f03d}",
    "With no audio": "\u{f03d}", "With microphone audio": "\u{f03d}",
    // trigger.capture.color, U+F00C9 — verified present in the Nerd Font.
    Color: "\u{f00c9}",
  };
  // One per application under Applications. Adding an app is an entry here, in
  // that level's `items`, and either `into` (it has settings of its own) or
  // `runs` (a single action).
  const APP_ICONS = {
    AeroSpace: "\u{f0b0c}", Ghostty: "\u{f120}", Slack: "\u{f198}",
  };
  // Ghostty's own settings. The font FAMILY is not one of them — see the
  // `font` level.
  const GHOSTTY_ICONS = {
    Size: "\u{f034}", Opacity: "\u{f042}", Padding: "\u{f065e}", Blur: "\u{f0c1c}",
  };
  const AEROSPACE_ICONS = { Gaps: "\u{f0b0c}", Workspaces: "\u{f0b0c}" };
  // Inside Font. Family reuses the Font glyph; Size is U+F034, fa-text-height.
  const FONT_MENU_ICONS = { Family: "\u{e659}", Size: "\u{f034}" };

  // Font is not a picker upstream, it is a menu PROVIDER — omarchy-menu.jsonc
  // gives Theme and Background an `action:` that launches the image picker,
  // but gives Font `"provider":"fonts"`, so it stays a list of rows in the
  // card. Menu.qml builds each provider row as
  //
  //   icon: (value === current) ? "\u2713" : (spec.icon || "")
  //
  // and the fonts provider's own icon is \ue659 — the very same glyph the
  // root Font entry uses. So every font row carries a glyph and the ACTIVE
  // font's row shows a check in place of it.
  //
  // This is deliberately NOT the other marker mechanism in that file:
  // MenuModel.labelFor appends " \u2713" to a STATIC entry's label when its
  // `checked:` expression is true. Provider rows leave the label alone and
  // put the marker in the icon column, which is what a font list is.
  const CURRENT_MARK = "\u2713";

  // Row metrics. The defaults are Omarchy's: baseRowHeight 50 (Menu.qml:102),
  // rowSpacing = Style.spacing.xs = 3, and the label at Style.font.heading 16
  // / Font.Medium. A level may override them.
  //
  // The Font level DOES override them, and that is a deliberate deviation from
  // upstream rather than a port of it — Pedro asked for roomier rows and
  // larger names on this specific list, which is 19 long family names rather
  // than three short words. Everything else keeps upstream's numbers.
  const ROWS = { height: 50, gap: 3, name: 16, icon: 18 };

  // Omarchy renders NO scrollbar anywhere in Menu.qml. When the rows do not
  // fit, the card is sized to end part-way through the first hidden row —
  // `rowPeek`, 55% of a row — because "a clipped row is what tells the eye
  // there is more below the fold, so never come out even on a row boundary"
  // (foldedListHeight). This reproduces that: full rows, then a peeking
  // sliver, never a clean boundary.
  //
  // Upstream's own budget is the panel height minus the card chrome, capped
  // at 70% of the screen (availableRowsHeight). CARD_CHROME is this page's
  // equivalent of that chrome: 18px padding twice, the 34px header, and the
  // 6px gap between header and list.
  const CARD_CHROME = 18 * 2 + 34 + 6;
  function listMaxHeight(count, m) {
    const step = m.height + m.gap;
    if (count <= 0) return m.height;
    // innerHeight is absent in the test DOM shim; 1080 is only a fallback.
    const viewport = window.innerHeight || 1080;
    const available = Math.round(viewport * 0.7) - CARD_CHROME;
    const contentHeight = count * step - m.gap;
    if (contentHeight <= available) return contentHeight;
    // How many rows fit whole, leaving room for the peek below them.
    const peek = Math.round(m.height * 0.55);
    let full = Math.floor((available - peek) / step);
    if (full < 1) full = 1;
    return full * step + peek;
  }

  // Geometry constants, ImagePicker.qml (v4.0.2). See the #cv block in
  // <style> for where each one lands.
  const EXPANDED_W = 768, SLICE_W = 108, SLICE_SPACING = -30;
  const STEP = SLICE_W + SLICE_SPACING;   // itemStep
  const NEARBY = 16;                      // `nearby`: |relativeIndex| <= 16

  // `picker` marks a level as a coverflow AND doubles as the preview kind
  // the host routes on (omamac preview --theme <name> vs omamac preview
  // <basename>). `labels` mirrors omarchy-menu-images' --show-labels, which
  // omarchy-theme-switcher passes and omarchy-theme-bg-switcher does not.
  // `current` is upstream's --selected: the picker opens ON the active
  // item rather than at index 0, which matters a great deal once a level
  // holds 22 themes.
  // Every level names its `parent`, so Escape walks back up one step rather
  // than always jumping to the root — which only worked while the menu was
  // exactly two deep.
  //
  // Font is a submenu, not a list: size is a property OF the font, not a peer
  // of Theme and Background, so it lives under Font rather than beside it.
  // Omarchy nests the same way where it has a settings group with more than
  // one knob (style.bar -> Position -> Top/Bottom).
  // Every level names its `parent`, so Escape walks back up one step.
  //
  // The root holds what is not specific to one application: the theme, the
  // wallpaper, and the monospace font FAMILY — which is a system-wide choice
  // (Omarchy models it that way too, `omarchy-font-set` setting the system
  // font), so an editor added later shares it rather than choosing its own.
  //
  // What IS per-application lives under Applications: the point size, which
  // every app sizes independently, and Ghostty's transparency.
  //
  // A level's rows do one of three things: open a submenu (`into`), run a
  // command outright (`runs`), or apply the value they name (`cmd`).
  const LEVELS = {
    root: {
      crumb: "Go",
      items: () => ["Theme", "Font", "Background", "Applications", "Capture", "Targets", "Deactivate"],
      icon: (name) => ROOT_ICONS[name] || "",
      into: { Theme: "theme", Font: "font", Background: "bg", Applications: "apps",
              Capture: "capture", Targets: "targets" },
      // Last, and the only root row that is not a way in to something. It
      // releases the hotkeys, so it is also the only row that makes this menu
      // unreachable — which is why `omamac pause` prints how to come back and
      // the host shows that as the alert.
      runs: { Deactivate: ["pause"] },
    },
    theme: {
      crumb: "Theme", cmd: "theme", picker: "theme", labels: true, parent: "root",
      current: () => DATA.theme.current || "",
      items: () => DATA.theme.options || [],
    },
    // Space INSIDE the terminal window, the counterpart to AeroSpace's gaps
    // between windows — the two are usually tuned together.
    padding: {
      crumb: "Padding", cmd: "padding", parent: "ghostty",
      current: () => String(DATA.padding?.current || ""),
      items: () => DATA.padding?.options || [],
      icon: (name) =>
        name === String(DATA.padding?.current || "") ? CURRENT_MARK : GHOSTTY_ICONS.Padding,
      rows: { height: 60, gap: 6, name: 19, icon: 20 },
    },
    // Only visible with the background below full opacity, which is what
    // Opacity above is for.
    blur: {
      crumb: "Blur", cmd: "blur", parent: "ghostty",
      current: () => String(DATA.blur?.current || ""),
      items: () => DATA.blur?.options || [],
      icon: (name) =>
        name === String(DATA.blur?.current || "") ? CURRENT_MARK : GHOSTTY_ICONS.Blur,
      rows: { height: 60, gap: 6, name: 19, icon: 20 },
    },
    bg: {
      crumb: "Background", cmd: "bg", picker: "bg", labels: false, parent: "root",
      // bg.current is an absolute path; the options are basenames.
      current: () => String(DATA.bg.current || "").split("/").pop(),
      items: () => DATA.bg.options || [],
    },
    // Which of the things omamac writes to are switched on. Switching one off
    // stops omamac writing to it; it does not undo what is already there —
    // see bin/omamac-targets for why that would be worse.
    targets: {
      crumb: "Targets", parent: "root",
      items: () => (DATA.targets || []).map((t) => t.label),
      icon: (label) => {
        const t = (DATA.targets || []).find((x) => x.label === label);
        return t && t.on ? TARGET_ON : TARGET_OFF;
      },
      // Toggling sends the NAME, never the label: "macOS appearance" is a
      // heading, `macos` is the thing.
      argsOf: (label) => {
        const t = (DATA.targets || []).find((x) => x.label === label);
        return t ? ["--toggle", t.name] : null;
      },
      cmd: "targets",
      rows: { height: 60, gap: 6, name: 19, icon: 20 },
    },
    // Screenshots and recording. Upstream's order, from omarchy-menu.jsonc:
    // Screenshot, then Stop (only while recording), then Screenrecord.
    capture: {
      crumb: "Capture", parent: "root",
      // Upstream hides the stop row with `"when": "pgrep -f gpu-screen-recorder"`.
      // menu-data answers the same question for us, so the row exists only
      // while there is something to stop.
      items: () => DATA.capture?.recording
        ? ["Screenshot", "Stop Recording", "Record", "Color"]
        : ["Screenshot", "Record", "Color"],
      icon: (name) => CAPTURE_ICONS[name] || "",
      into: { Record: "record" },
      // Rows that hand the host a message of their own rather than applying a
      // value: both of these have to run the region picker first, which lives
      // in the host, not here.
      sends: {
        Screenshot: { action: "capture", kind: "screenshot" },
        Color: { action: "capture", kind: "color" },
      },
      runs: { "Stop Recording": ["capture", "--stop"] },
      rows: { height: 60, gap: 6, name: 19, icon: 20 },
    },
    // Desktop audio is missing on purpose, not by omission: screencapture can
    // only record an INPUT device, so a stock Mac has no way to capture system
    // output. See bin/omamac-capture.
    record: {
      crumb: "Record", parent: "capture",
      items: () => ["With no audio", "With microphone audio"],
      icon: (name) => CAPTURE_ICONS[name] || "",
      // The OTHER card Menu.qml:111 widens to 520 — upstream names
      // `trigger.capture.screenrecord` alongside `style.font` and leaves every
      // other menu at 300. Its own rows go up to "With desktop + microphone
      // audio + webcam"; even the two here ellipsis away at 300, which is how
      // this was noticed.
      width: 520,
      sends: {
        "With no audio": { action: "capture", kind: "record", audio: false },
        "With microphone audio": { action: "capture", kind: "record", audio: true },
      },
      rows: { height: 60, gap: 6, name: 19, icon: 20 },
    },
    // Per-application. Some apps have settings of their own; some can only be
    // handed a theme to paste, because omamac cannot drive them — see
    // bin/omamac-slack for why Slack in particular has no automatic path.
    apps: {
      crumb: "Applications", parent: "root",
      // AeroSpace disappears when it is switched off in Targets: its Gaps and
      // Workspaces levels write to a config omamac has been told to leave
      // alone, so offering them would be offering a no-op.
      items: () => {
        const off = (DATA.targets || []).some((t) => t.name === "aerospace" && !t.on);
        return off ? ["Ghostty", "Slack"] : ["AeroSpace", "Ghostty", "Slack"];
      },
      icon: (name) => APP_ICONS[name] || "",
      into: { AeroSpace: "aerospace", Ghostty: "ghostty" },
      runs: { Slack: ["slack", "--copy"] },
    },
    // AeroSpace's gaps. Its CLI cannot set them and its config has no include
    // mechanism, so omamac renders the whole config from a template — see
    // bin/omamac-aerospace.
    aerospace: {
      crumb: "AeroSpace", parent: "apps",
      items: () => ["Gaps", "Workspaces"],
      icon: (name) => AEROSPACE_ICONS[name] || "",
      into: { Gaps: "gaps", Workspaces: "workspaces" },
    },
    gaps: {
      crumb: "Gaps", cmd: "aerospace", parent: "aerospace",
      current: () => String(DATA.gaps?.current || ""),
      items: () => DATA.gaps?.options || [],
      icon: (name) =>
        name === String(DATA.gaps?.current || "") ? CURRENT_MARK : AEROSPACE_ICONS.Gaps,
      rows: { height: 60, gap: 6, name: 19, icon: 20 },
    },
    // Each row is one workspace and the monitor it is pinned to. Drilling in
    // opens the monitor list for THAT workspace — see `ctx` below, which is
    // what carries which row was picked.
    workspaces: {
      crumb: "Workspaces", parent: "aerospace",
      items: () => (DATA.workspaces?.list || []).map((w) => `${w.id}  \u2192  ${w.monitor}`),
      icon: () => AEROSPACE_ICONS.Workspaces,
      intoAll: "wsmonitor",
      rows: { height: 60, gap: 6, name: 19, icon: 20 },
    },
    wsmonitor: {
      crumb: "Monitor", cmd: "aerospace", parent: "workspaces",
      items: () => DATA.workspaces?.monitors || [],
      // The row picked in `workspaces` decides both which monitor is current
      // and which workspace gets reassigned. Its id is the leading number of
      // that row's label — read from the label rather than its position,
      // because filtering reorders what `sel` indexes into.
      current: () => {
        const w = ctxWorkspace();
        return w ? w.monitor : "";
      },
      argsOf: (name) => {
        const w = ctxWorkspace();
        return w ? ["--workspace", `${w.id}=${name}`] : null;
      },
      icon: (name) => {
        const w = ctxWorkspace();
        return w && name === w.monitor ? CURRENT_MARK : AEROSPACE_ICONS.Workspaces;
      },
      rows: { height: 60, gap: 6, name: 19, icon: 20 },
    },
    ghostty: {
      crumb: "Ghostty", parent: "apps",
      items: () => ["Size", "Opacity", "Padding", "Blur"],
      icon: (name) => GHOSTTY_ICONS[name] || "",
      into: { Size: "fontsize", Opacity: "opacity", Padding: "padding", Blur: "blur" },
    },
    // `width` follows Menu.qml:111, which gives style.font and the
    // screen-record menu 520 and every other card 300. Family names are what
    // need that room here; see the `record` level for the other one.
    // A leaf list straight off the root, which is also upstream's shape:
    // omarchy-menu.jsonc gives style.font a `provider` rather than children.
    font: {
      crumb: "Font", cmd: "font", parent: "root",
      current: () => DATA.font.current || "",
      items: () => DATA.font.options || [],
      icon: (name) =>
        name === (DATA.font.current || "") ? CURRENT_MARK : ROOT_ICONS.Font,
      width: 520,
      // Deliberate deviation — see ROWS above.
      rows: { height: 60, gap: 6, name: 19, icon: 20 },
    },
    // Ghostty points, shown exactly as they are written to the config.
    fontsize: {
      crumb: "Size", cmd: "font-size", parent: "ghostty",
      current: () => String(DATA.fontSize?.current || ""),
      items: () => DATA.fontSize?.options || [],
      icon: (name) =>
        name === String(DATA.fontSize?.current || "") ? CURRENT_MARK : GHOSTTY_ICONS.Size,
      rows: { height: 60, gap: 6, name: 19, icon: 20 },
    },
    // Percentages, because that is what the picker should say — Ghostty's own
    // 0..1 float is a rendering detail.
    opacity: {
      crumb: "Opacity", cmd: "opacity", parent: "ghostty",
      argOf: (name) => name.replace(/%$/, ""),
      // The displayed form, because `current` is matched against the ITEMS to
      // decide which row to open on — and those carry the % suffix.
      current: () => {
        const c = String(DATA.opacity?.current || "");
        return c ? c + "%" : "";
      },
      items: () => (DATA.opacity?.options || []).map((v) => String(v) + "%"),
      icon: (name) =>
        name === String(DATA.opacity?.current || "") + "%" ? CURRENT_MARK : GHOSTTY_ICONS.Opacity,
      rows: { height: 60, gap: 6, name: 19, icon: 20 },
    },
  };

  let level = "root", sel = 0, filter = "";
  // The row a submenu was entered from, when the child needs to know. Only
  // `wsmonitor` uses it: which monitor to check, and which workspace to
  // reassign, both depend on the workspace row that was picked.
  let ctx = null;
  const ctxWorkspace = () => {
    const id = String(ctx || "").match(/^(\d+)/);
    if (!id) return null;
    return (DATA.workspaces?.list || []).find((w) => String(w.id) === id[1]) || null;
  };
  // Previews are cached PER KIND, not in one flat map. A theme is
  // "tokyo-night" and a wallpaper is "tokyo-night-0-swirl.jpg" — close
  // enough that a future rename could collide, and a preview filed under
  // the wrong level shows up as the wrong image with nothing logged. The
  // host echoes the kind back with every thumbnail so this stays exact.
  const thumbs = { theme: {}, bg: {} };     // kind -> name -> data URI
  // ONE request per picker level, for the whole level — not one per item.
  // The host can only run a single task per level (hs.task loses the stdout
  // of most of its children when a couple of dozen run at once, silently and
  // with exit status 0), so omamac builds every thumbnail for the level in
  // one go and the host pushes them back as they are read.
  const requested = new Set();              // kinds already asked for
  const el = {
    hdr: hdr, list: list, card: card,
    cv: cv, strip: cvstrip, chrome: cvchrome, label: cvlabel, filterLine: cvfilter,
  };

  const visible = () => {
    const L = LEVELS[level], f = filter.toLowerCase();
    return L.items().filter((i) => i.toLowerCase().includes(f));
  };

  // ImagePickerModel.js's labelForPath, verbatim: drop the extension, turn
  // -/_ runs into spaces, capitalise each word. "tokyo-night" -> "Tokyo
  // Night"; a wallpaper "1-sunset-lake.png" -> "1 Sunset Lake".
  const labelFor = (name) =>
    String(name || "")
      .replace(/\.[^/.]+$/, "")
      .replace(/[-_]+/g, " ")
      .replace(/\b\w/g, (m) => m.toUpperCase());

  // Ask the host, once, for every preview at this level. Guarded on
  // `requested` so a re-render — every keystroke, every omamacSetPreview
  // callback — never re-sends. Without that guard this is O(N) duplicate
  // batches, each respawning sips for the whole level.
  function requestPreviews(kind) {
    if (requested.has(kind)) return;
    requested.add(kind);
    send({ action: "previews", kind });
  }

  function renderList(items) {
    const iconFor = LEVELS[level].icon;
    el.list.innerHTML = "";
    items.forEach((name, i) => {
      const row = document.createElement("div");
      row.className = "row" + (i === sel ? " on" : "");

      const icon = document.createElement("div");
      icon.className = "icon";
      // Per level, because upstream's icon column means different things at
      // each: a fixed glyph per root entry, and per provider row either the
      // provider's glyph or the check marking the active value.
      if (iconFor) icon.textContent = iconFor(name);
      row.append(icon);

      const n = document.createElement("span");
      n.className = "name"; n.textContent = name; row.append(n);

      row.onclick = () => { sel = i; choose(); };
      el.list.append(row);
    });
    el.list.children[sel]?.scrollIntoView({ block: "nearest" });
  }

  // Omarchy's coverflow (ImagePicker.qml v4.0.2) — see the #cv rules in
  // <style> for the geometry this mirrors. Every item gets the same
  // clip-path parallelogram; the selected one alone expands from a 108x432
  // slice to the full 768x475 image, and everything else is laid out
  // relative to it.
  function renderCoverflow(items, kind) {
    requestPreviews(kind);
    el.strip.innerHTML = "";
    // clientWidth is 0/undefined until the strip is in the layout (and in
    // the test DOM shim), so fall back to upstream's own carousel width.
    const stripW = el.strip.clientWidth || 1782;
    const previewX = (stripW - EXPANDED_W) / 2;

    items.forEach((name, i) => {
      const rel = i - sel;
      // `visible: nearby` — upstream renders 16 either side of the
      // selection and no more, which is what keeps a 22-theme strip from
      // building (and requesting previews for) items nobody can see.
      if (Math.abs(rel) > NEARBY) return;

      const item = document.createElement("div");
      item.className = "cv" + (rel === 0 ? " on" : "");
      item.style.left = (
        rel === 0 ? previewX
        : rel < 0 ? previewX + rel * STEP
        : previewX + EXPANDED_W + SLICE_SPACING + (rel - 1) * STEP
      ) + "px";
      // z: selected 100, the rest fading back with distance so each slice
      // overlaps the one further from centre.
      if (rel !== 0) item.style.zIndex = String(50 - Math.min(Math.abs(rel), 40));

      // .cv-inner carries the image (or the neutral placeholder, via its
      // own CSS background) clipped inset from .cv's parallelogram by the
      // border thickness — see the .cv/.cv-inner rules in <style>.
      const inner = document.createElement("div");
      inner.className = "cv-inner";

      if (thumbs[kind][name]) {
        const img = document.createElement("img");
        img.className = "cv-img";
        img.src = thumbs[kind][name];
        inner.append(img);
      }
      // Otherwise the neutral placeholder (the .cv-inner background) stands
      // in — never a broken <img>: no src is set until a data URI actually
      // arrives, and one may never arrive for an item whose source is gone.
      item.append(inner);

      // Matches ImagePicker.qml's MouseArea exactly: clicking the item
      // that's already centred applies it; clicking any other slides it
      // into the centre first, same as Left/Right/Enter would.
      item.onclick = () => { if (rel === 0) choose(); else { sel = i; render(); } };
      el.strip.append(item);
    });
  }

  // The chrome under the strip. Upstream's `currentLabel()`: the selected
  // item's label, or "No matches" when a filter has excluded everything,
  // or nothing at all when the level is simply empty.
  function renderChrome(items, L) {
    const showLabel = !!L.labels;
    const filtering = filter.length > 0;
    el.label.hidden = !showLabel;
    el.filterLine.hidden = !filtering;
    if (showLabel) {
      el.label.textContent =
        items.length ? labelFor(items[sel]) : (filtering ? "No matches" : "");
    }
    if (filtering) el.filterLine.textContent = filter;
    // bottomChromeHeight. Upstream computes this from the --show-labels /
    // --filterable FLAGS, and omarchy-theme-bg-switcher passes neither — so
    // its background picker cannot be filtered at all. This menu does let
    // you filter every level, so the background level's chrome grows to
    // upstream's filterable-without-labels value only while a filter is
    // actually typed; with the field empty it is upstream's 30 exactly.
    el.chrome.style.setProperty(
      "--chrome", (showLabel ? 104 : (filtering ? 60 : 30)) + "px");
  }

  function render() {
    const L = LEVELS[level], items = visible();
    // No separate input box: the header line doubles as the search display.
    // Empty filter shows "<Level>…" dimmed; typing shows the typed text at
    // full opacity.
    el.hdr.textContent = filter ? filter : (L.crumb + "…");
    el.hdr.className = filter ? "typed" : "";
    el.card.style.setProperty("--card-w", (L.width || 300) + "px");
    const m = L.rows || ROWS;
    el.card.style.setProperty("--row-h", m.height + "px");
    el.card.style.setProperty("--row-gap", m.gap + "px");
    el.card.style.setProperty("--name-size", m.name + "px");
    el.card.style.setProperty("--icon-size", m.icon + "px");
    el.card.style.setProperty("--list-max-h", listMaxHeight(items.length, m) + "px");

    // Each branch clears the OTHER view's contents as well as filling its
    // own. Hiding a container leaves its children — and their onclick
    // closures, still bound to the level they were built for — alive in the
    // DOM; only one of these two views is ever real at a time.
    if (L.picker) {
      el.card.hidden = true;
      el.cv.hidden = false;
      el.list.innerHTML = "";
      renderCoverflow(items, L.picker);
      renderChrome(items, L);
    } else {
      el.card.hidden = false;
      el.cv.hidden = true;
      el.strip.innerHTML = "";
      renderList(items);
    }
  }

  // The host calls this once per thumbnail it managed to read, as it reads
  // them. An empty uri is never cached: it would render as a broken <img>,
  // and the placeholder is the correct thing to keep showing for an item
  // whose source is missing or unreadable.
  //
  // `kind` defaults to "bg" for the same reason the host defaults it there:
  // that is what an unqualified preview meant before the Theme level existed.
  window.omamacSetPreview = (name, uri, kind) => {
    const k = kind === "theme" ? "theme" : "bg";
    if (!uri) return;
    thumbs[k][name] = uri;
    render();
  };

  // Entering a level opens ON its current value, the way both Omarchy
  // switchers pass --selected. At index 0 a 22-theme coverflow would always
  // open on whatever sorts first rather than on the theme you are actually
  // running.
  function enterLevel(next) {
    level = next;
    filter = "";
    const L = LEVELS[level];
    const at = L.current ? visible().indexOf(L.current()) : -1;
    sel = at >= 0 ? at : 0;
    render();
  }

  function choose() {
    const items = visible();
    if (!items.length) return;
    const pick = items[sel];
    // Three kinds of row: one that RUNS a command outright, one that opens a
    // submenu, and one that applies the value it names.
    const L = LEVELS[level];
    // A row that hands the host a whole message. Capture needs this because the
    // region picker runs in the host before any command does — there is no
    // value to apply at the point the row is chosen.
    const msg = L.sends && L.sends[pick];
    if (msg) return send(msg);
    const run = L.runs && L.runs[pick];
    if (run) return send({ action: "apply", cmd: run[0], arg: run[1] });
    // `intoAll` is a submenu every row opens — the rows are data, not a fixed
    // set of destinations, so the picked row is remembered instead.
    const into = L.intoAll ? L.intoAll : (L.into && L.into[pick]);
    if (into) {
      ctx = pick;
      enterLevel(into);
    } else if (L.argsOf) {
      const args = L.argsOf(pick);
      if (args) send({ action: "apply", cmd: L.cmd, args });
    } else {
      // Levels may display a value differently from how the CLI takes it —
      // Opacity shows "85%" but `omamac opacity` wants 85.
      const strip = LEVELS[level].argOf;
      send({ action: "apply", cmd: LEVELS[level].cmd, arg: strip ? strip(pick) : pick });
    }
  }

  function back() {
    const parent = LEVELS[level].parent;
    if (!parent) return send({ action: "close" });
    // Land back on the row that was drilled into, not at the top of the
    // parent — Escape out of Size should leave Size highlighted under Font.
    const from = level;
    level = parent;
    filter = "";
    const rows = visible();
    const into = LEVELS[level].into || {};
    const at = LEVELS[level].intoAll === from
      ? rows.indexOf(ctx)                       // came from a data row
      : rows.findIndex((r) => into[r] === from);
    sel = at >= 0 ? at : 0;
    render();
  }

  document.addEventListener("keydown", (e) => {
    const n = visible().length;
    // The picker levels are horizontal coverflows, so Left/Right are their
    // natural selection keys — but Up/Down still work too, same as every
    // other level, for consistency across the whole menu.
    if (e.key === "ArrowDown" || e.key === "ArrowRight") { sel = n ? (sel + 1) % n : 0; render(); }
    else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { sel = n ? (sel - 1 + n) % n : 0; render(); }
    else if (e.key === "Enter") choose();
    else if (e.key === "Escape") back();
    else if (e.key === "Backspace") { filter = filter.slice(0, -1); sel = 0; render(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      filter += e.key; sel = 0; render();
    }
    else return;
    e.preventDefault();
  });

  render();
</script>
