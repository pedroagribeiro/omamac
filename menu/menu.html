<style>
  :root {
    --bg: #1a1b26; --fg: #a9b1d6; --accent: #7aa2f7;
    /* Omarchy renders the menu in the system monospace font — the same one
       the active theme sets. This is only a fallback for when font.current
       is empty; the script below overrides it with the real theme font. */
    --font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* Omarchy exposes ONE cornerRadius token, shared by the card and its rows,
       and Style.qml declares it 0 by default (on Linux it mirrors Hyprland's
       decoration:rounding). Square is therefore the faithful default. Set this
       to e.g. 8px if you prefer rounded corners — both follow together. */
    --radius: 0px;
    /* Qt's `style: Text.Outline; styleColor: Util.alpha(dimColor, 0.7)` on the
       picker's label and filter lines — dimColor is the theme background. */
    --outline: color-mix(in srgb, var(--bg) 70%, transparent);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-family);
    font-size: 14px;
    color: var(--fg);
    /* Full-viewport scrim behind everything: theme background at 50% alpha. */
    background: color-mix(in srgb, var(--bg) 50%, transparent);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #card {
    width: 300px;
    /* Fully opaque — no blur, no translucency. */
    background: var(--bg);
    border: 1px solid var(--fg);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #hdr {
    height: 34px;
    display: flex;
    align-items: center;
    font-size: 16px;
    background: transparent;
    opacity: .58;                 /* placeholder: "<Level>…" */
  }
  #hdr.typed { opacity: 1; }      /* once the user has typed something */
  #list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow-y: auto;
    /* Not part of the spec values — needed so a long list doesn't push the
       card off-screen; the card itself has no max-height in the source
       values given. */
    max-height: min(60vh, 400px);
  }
  .row {
    display: flex;
    align-items: center;
    height: 50px;
    border-radius: var(--radius);
    cursor: default;
    color: var(--fg);
  }
  .row.on {
    background: color-mix(in srgb, var(--fg) 8%, transparent);
    color: var(--accent);         /* icon + label both pick this up via currentColor */
  }
  .icon {
    width: 36px; flex: 0 0 36px;
    margin-left: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    line-height: 1;
  }
  .name {
    flex: 1; min-width: 0;
    font-size: 16px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-right: 10px;
  }
  #card[hidden] { display: none; }

  /* ------------------------------------------------------------------ *
     Picker levels (Theme and Background): Omarchy's coverflow, not the
     300px card.

     Both levels are ONE component upstream. omarchy.image-picker's manifest
     describes itself as the "Image-grid selector overlay used for
     wallpapers, themes, and any other directory of images", and both
     switchers shell out to the same omarchy-menu-images:

       omarchy-theme-switcher  --print-name --show-labels --filterable ...
       omarchy-theme-bg-switcher                       (neither flag)

     So the only difference between the two levels here is the chrome under
     the strip, exactly as those flags imply — the geometry, the borders and
     the dim are shared.

     Values below are lifted verbatim from ImagePicker.qml (v4.0.2):
     expandedWidth/Height 768x475, sliceWidth/Height 108x432, sliceSpacing
     -30 (the item overlap), skewOffset 28 (the parallelogram cut),
     bottomChromeHeight = showLabels ? (filterable ? 104 : 74)
                                     : (filterable ?  60 : 30).
     One deviation, and it's deliberate: the source has NO `Behavior on
     width` or any animation anywhere in ImagePicker.qml — x/width/height/y
     are plain bindings, so the real picker SNAPS between slice and expanded
     size with no easing. This matches that: no transition is added here.
   * ------------------------------------------------------------------ */
  #cv {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%; height: 100%;
  }
  #cv:not([hidden]) { display: flex; }
  /* The strip positions every item ABSOLUTELY relative to the selected one,
     the way ImagePicker.qml's delegate binds `x` off `relativeIndex`. A
     plain flex row cannot do this: it centres the strip as a whole, so with
     22 themes the selected item drifts far off-centre. Upstream hardcodes
     the carousel width to expandedWidth + 13 slices (1782px) and centres
     within it; using the real viewport width instead keeps the selected
     item dead-centre on any display, which is the intent that constant
     encodes on the screens Omarchy targets. */
  #cvstrip {
    position: relative;
    width: 100%;
    height: 475px;              /* expandedHeight */
    overflow: hidden;
  }
  .cv {
    position: absolute;
    top: 21.5px;                /* (expandedHeight - sliceHeight) / 2 */
    width: 108px;
    height: 432px;
    /* skewOffset: 28 -> top-left x=28, top-right x=100%, bottom-right
       x=100%-28, bottom-left x=0. Same parallelogram on every item,
       expanded or not. */
    clip-path: polygon(28px 0, 100% 0, calc(100% - 28px) 100%, 0 100%);
    cursor: default;
    /* Border, ImagePicker.qml (v4.0.2) verbatim: strokeWidth 1/3px,
       strokeColor foreground-at-28%/accent for unselected/selected. A plain
       CSS `border` would be sliced off at the slanted edges by the
       clip-path above, so instead this element's own background stands in
       for the stroke: --s is the thickness, and .cv-inner (below) clips to
       the same parallelogram inset by --s on every edge, leaving exactly
       that margin of this background visible as a uniform-width outline. */
    --s: 1px;
    background: color-mix(in srgb, var(--fg) 28%, transparent);
    z-index: 50;
  }
  .cv.on {
    top: 0;
    width: 768px;
    height: 475px;
    z-index: 100;
    --s: 3px;
    background: var(--accent);
  }
  .cv-inner {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    /* Same parallelogram as .cv, inset by --s on every edge — the visible
       gap between this clip and .cv's own is the stroke. The skew is only
       28px across a 432–475px height, so insetting both axes by the same
       --s keeps the perpendicular thickness close enough to uniform that
       the discrepancy isn't visible. */
    clip-path: polygon(
      calc(28px + var(--s)) var(--s),
      calc(100% - var(--s)) var(--s),
      calc(100% - 28px - var(--s)) calc(100% - var(--s)),
      var(--s) calc(100% - var(--s))
    );
    /* Neutral placeholder until a data URI arrives — never a broken-image
       box. Lives here (not on .cv) so an item awaiting its preview still
       shows a bordered frame instead of a solid block. */
    background: color-mix(in srgb, var(--fg) 15%, transparent);
  }
  /* ImagePicker.qml lays a `Rectangle { color: Util.alpha(dimColor,
     item.selected ? 0 : 0.42) }` over every slice — the unselected ones
     recede into the scrim and only the centred item reads at full
     brightness. dimColor is the theme background. */
  .cv-inner::after {
    content: "";
    position: absolute;
    inset: 0;
    background: color-mix(in srgb, var(--bg) 42%, transparent);
  }
  .cv.on .cv-inner::after { background: transparent; }
  .cv-img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  /* bottomChromeHeight: the space reserved below the strip. Reserving it
     (rather than letting the label size the column) is what makes the strip
     sit where Omarchy puts it — vertically centred in the height that
     remains above the chrome — instead of shifting up and down as the label
     appears and disappears. */
  #cvchrome {
    flex: 0 0 auto;
    height: var(--chrome, 30px);
    width: 768px;               /* expandedWidth: both lines elide within it */
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }
  #cvlabel, #cvfilter {
    width: 100%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--fg);
    text-shadow:
      -1px -1px 0 var(--outline),  1px -1px 0 var(--outline),
      -1px  1px 0 var(--outline),  1px  1px 0 var(--outline),
       0   -1px 0 var(--outline),  0    1px 0 var(--outline),
      -1px  0   0 var(--outline),  1px  0   0 var(--outline);
  }
  #cvlabel {
    margin-top: 16px;           /* Style.space(16) */
    font-size: 24px;            /* Style.font.display */
    font-weight: 600;           /* Font.DemiBold */
    line-height: 1.15;
  }
  #cvfilter {
    margin-top: 8px;            /* Style.space(8) */
    font-size: 14px;            /* Style.font.title */
    opacity: .85;
  }
  #cvlabel[hidden], #cvfilter[hidden] { display: none; }
</style>

<div id="card">
  <div id="hdr"></div>
  <div id="list"></div>
</div>
<div id="cv" hidden>
  <div id="cvstrip"></div>
  <div id="cvchrome">
    <div id="cvlabel" hidden></div>
    <div id="cvfilter" hidden></div>
  </div>
</div>

<script>
  const DATA = window.OMAMAC || { theme: {}, font: {}, bg: {}, colors: {} };
  const send = (m) => window.webkit?.messageHandlers?.omamac?.postMessage(m);

  if (DATA.colors) {
    const r = document.documentElement.style;
    if (DATA.colors.background) r.setProperty("--bg", DATA.colors.background);
    if (DATA.colors.foreground) r.setProperty("--fg", DATA.colors.foreground);
    if (DATA.colors.accent) r.setProperty("--accent", DATA.colors.accent);
  }

  // Render in whatever monospace font the user has chosen, same as Omarchy.
  // Falls back to a system monospace stack when font.current is empty; the
  // Nerd Font glyphs below simply won't render in that case, which is
  // acceptable and must not break layout.
  if (DATA.font && DATA.font.current) {
    document.documentElement.style.setProperty(
      "--font-family",
      `"${DATA.font.current}", ui-monospace, SFMono-Regular, Menlo, monospace`
    );
  }

  // Nerd Font glyphs for the root-level rows. Sourced verbatim from
  // omarchy v4.0.2's own menu definition
  // (default/omarchy/omarchy-menu.jsonc), stored as \u{} escapes rather
  // than literal PUA characters so a future edit/copy cannot silently
  // blank them (that's exactly what happened to the Font and marker
  // glyphs when they were first typed as literals here). Omarchy also
  // defines U+EBCF for the "Style" parent entry — unused here, since our
  // root level *is* that Style submenu.
  const ROOT_ICONS = { Theme: "\u{f0e0c}", Font: "\u{e659}", Background: "\u{f03e}" };

  // Geometry constants, ImagePicker.qml (v4.0.2). See the #cv block in
  // <style> for where each one lands.
  const EXPANDED_W = 768, SLICE_W = 108, SLICE_SPACING = -30;
  const STEP = SLICE_W + SLICE_SPACING;   // itemStep
  const NEARBY = 16;                      // `nearby`: |relativeIndex| <= 16

  // `picker` marks a level as a coverflow AND doubles as the preview kind
  // the host routes on (omamac preview --theme <name> vs omamac preview
  // <basename>). `labels` mirrors omarchy-menu-images' --show-labels, which
  // omarchy-theme-switcher passes and omarchy-theme-bg-switcher does not.
  // `current` is upstream's --selected: the picker opens ON the active
  // item rather than at index 0, which matters a great deal once a level
  // holds 22 themes.
  const LEVELS = {
    root: { crumb: "Go", items: () => ["Theme", "Font", "Background"] },
    theme: {
      crumb: "Theme", cmd: "theme", picker: "theme", labels: true,
      current: () => DATA.theme.current || "",
      items: () => DATA.theme.options || [],
    },
    font: {
      crumb: "Font", cmd: "font",
      current: () => DATA.font.current || "",
      items: () => DATA.font.options || [],
    },
    bg: {
      crumb: "Background", cmd: "bg", picker: "bg", labels: false,
      // bg.current is an absolute path; the options are basenames.
      current: () => String(DATA.bg.current || "").split("/").pop(),
      items: () => DATA.bg.options || [],
    },
  };

  let level = "root", sel = 0, filter = "";
  // Previews are cached PER KIND, not in one flat map. A theme is
  // "tokyo-night" and a wallpaper is "tokyo-night-0-swirl.jpg" — close
  // enough that a future rename could collide, and a preview filed under
  // the wrong level shows up as the wrong image with nothing logged. The
  // host echoes the kind back with every thumbnail so this stays exact.
  const thumbs = { theme: {}, bg: {} };     // kind -> name -> data URI
  // ONE request per picker level, for the whole level — not one per item.
  // The host can only run a single task per level (hs.task loses the stdout
  // of most of its children when a couple of dozen run at once, silently and
  // with exit status 0), so omamac builds every thumbnail for the level in
  // one go and the host pushes them back as they are read.
  const requested = new Set();              // kinds already asked for
  const el = {
    hdr: hdr, list: list, card: card,
    cv: cv, strip: cvstrip, chrome: cvchrome, label: cvlabel, filterLine: cvfilter,
  };

  const visible = () => {
    const L = LEVELS[level], f = filter.toLowerCase();
    return L.items().filter((i) => i.toLowerCase().includes(f));
  };

  // ImagePickerModel.js's labelForPath, verbatim: drop the extension, turn
  // -/_ runs into spaces, capitalise each word. "tokyo-night" -> "Tokyo
  // Night"; a wallpaper "1-sunset-lake.png" -> "1 Sunset Lake".
  const labelFor = (name) =>
    String(name || "")
      .replace(/\.[^/.]+$/, "")
      .replace(/[-_]+/g, " ")
      .replace(/\b\w/g, (m) => m.toUpperCase());

  // Ask the host, once, for every preview at this level. Guarded on
  // `requested` so a re-render — every keystroke, every omamacSetPreview
  // callback — never re-sends. Without that guard this is O(N) duplicate
  // batches, each respawning sips for the whole level.
  function requestPreviews(kind) {
    if (requested.has(kind)) return;
    requested.add(kind);
    send({ action: "previews", kind });
  }

  function renderList(items) {
    el.list.innerHTML = "";
    items.forEach((name, i) => {
      const row = document.createElement("div");
      row.className = "row" + (i === sel ? " on" : "");

      const icon = document.createElement("div");
      icon.className = "icon";
      if (level === "root") icon.textContent = ROOT_ICONS[name] || "";
      row.append(icon);

      const n = document.createElement("span");
      n.className = "name"; n.textContent = name; row.append(n);

      row.onclick = () => { sel = i; choose(); };
      el.list.append(row);
    });
    el.list.children[sel]?.scrollIntoView({ block: "nearest" });
  }

  // Omarchy's coverflow (ImagePicker.qml v4.0.2) — see the #cv rules in
  // <style> for the geometry this mirrors. Every item gets the same
  // clip-path parallelogram; the selected one alone expands from a 108x432
  // slice to the full 768x475 image, and everything else is laid out
  // relative to it.
  function renderCoverflow(items, kind) {
    requestPreviews(kind);
    el.strip.innerHTML = "";
    // clientWidth is 0/undefined until the strip is in the layout (and in
    // the test DOM shim), so fall back to upstream's own carousel width.
    const stripW = el.strip.clientWidth || 1782;
    const previewX = (stripW - EXPANDED_W) / 2;

    items.forEach((name, i) => {
      const rel = i - sel;
      // `visible: nearby` — upstream renders 16 either side of the
      // selection and no more, which is what keeps a 22-theme strip from
      // building (and requesting previews for) items nobody can see.
      if (Math.abs(rel) > NEARBY) return;

      const item = document.createElement("div");
      item.className = "cv" + (rel === 0 ? " on" : "");
      item.style.left = (
        rel === 0 ? previewX
        : rel < 0 ? previewX + rel * STEP
        : previewX + EXPANDED_W + SLICE_SPACING + (rel - 1) * STEP
      ) + "px";
      // z: selected 100, the rest fading back with distance so each slice
      // overlaps the one further from centre.
      if (rel !== 0) item.style.zIndex = String(50 - Math.min(Math.abs(rel), 40));

      // .cv-inner carries the image (or the neutral placeholder, via its
      // own CSS background) clipped inset from .cv's parallelogram by the
      // border thickness — see the .cv/.cv-inner rules in <style>.
      const inner = document.createElement("div");
      inner.className = "cv-inner";

      if (thumbs[kind][name]) {
        const img = document.createElement("img");
        img.className = "cv-img";
        img.src = thumbs[kind][name];
        inner.append(img);
      }
      // Otherwise the neutral placeholder (the .cv-inner background) stands
      // in — never a broken <img>: no src is set until a data URI actually
      // arrives, and one may never arrive for an item whose source is gone.
      item.append(inner);

      // Matches ImagePicker.qml's MouseArea exactly: clicking the item
      // that's already centred applies it; clicking any other slides it
      // into the centre first, same as Left/Right/Enter would.
      item.onclick = () => { if (rel === 0) choose(); else { sel = i; render(); } };
      el.strip.append(item);
    });
  }

  // The chrome under the strip. Upstream's `currentLabel()`: the selected
  // item's label, or "No matches" when a filter has excluded everything,
  // or nothing at all when the level is simply empty.
  function renderChrome(items, L) {
    const showLabel = !!L.labels;
    const filtering = filter.length > 0;
    el.label.hidden = !showLabel;
    el.filterLine.hidden = !filtering;
    if (showLabel) {
      el.label.textContent =
        items.length ? labelFor(items[sel]) : (filtering ? "No matches" : "");
    }
    if (filtering) el.filterLine.textContent = filter;
    // bottomChromeHeight. Upstream computes this from the --show-labels /
    // --filterable FLAGS, and omarchy-theme-bg-switcher passes neither — so
    // its background picker cannot be filtered at all. This menu does let
    // you filter every level, so the background level's chrome grows to
    // upstream's filterable-without-labels value only while a filter is
    // actually typed; with the field empty it is upstream's 30 exactly.
    el.chrome.style.setProperty(
      "--chrome", (showLabel ? 104 : (filtering ? 60 : 30)) + "px");
  }

  function render() {
    const L = LEVELS[level], items = visible();
    // No separate input box: the header line doubles as the search display.
    // Empty filter shows "<Level>…" dimmed; typing shows the typed text at
    // full opacity.
    el.hdr.textContent = filter ? filter : (L.crumb + "…");
    el.hdr.className = filter ? "typed" : "";

    // Each branch clears the OTHER view's contents as well as filling its
    // own. Hiding a container leaves its children — and their onclick
    // closures, still bound to the level they were built for — alive in the
    // DOM; only one of these two views is ever real at a time.
    if (L.picker) {
      el.card.hidden = true;
      el.cv.hidden = false;
      el.list.innerHTML = "";
      renderCoverflow(items, L.picker);
      renderChrome(items, L);
    } else {
      el.card.hidden = false;
      el.cv.hidden = true;
      el.strip.innerHTML = "";
      renderList(items);
    }
  }

  // The host calls this once per thumbnail it managed to read, as it reads
  // them. An empty uri is never cached: it would render as a broken <img>,
  // and the placeholder is the correct thing to keep showing for an item
  // whose source is missing or unreadable.
  //
  // `kind` defaults to "bg" for the same reason the host defaults it there:
  // that is what an unqualified preview meant before the Theme level existed.
  window.omamacSetPreview = (name, uri, kind) => {
    const k = kind === "theme" ? "theme" : "bg";
    if (!uri) return;
    thumbs[k][name] = uri;
    render();
  };

  // Entering a level opens ON its current value, the way both Omarchy
  // switchers pass --selected. At index 0 a 22-theme coverflow would always
  // open on whatever sorts first rather than on the theme you are actually
  // running.
  function enterLevel(next) {
    level = next;
    filter = "";
    const L = LEVELS[level];
    const at = L.current ? visible().indexOf(L.current()) : -1;
    sel = at >= 0 ? at : 0;
    render();
  }

  function choose() {
    const items = visible();
    if (!items.length) return;
    const pick = items[sel];
    if (level === "root") {
      enterLevel({ Theme: "theme", Font: "font", Background: "bg" }[pick]);
    } else {
      send({ action: "apply", cmd: LEVELS[level].cmd, arg: pick });
    }
  }

  function back() {
    if (level === "root") return send({ action: "close" });
    level = "root"; sel = 0; filter = ""; render();
  }

  document.addEventListener("keydown", (e) => {
    const n = visible().length;
    // The picker levels are horizontal coverflows, so Left/Right are their
    // natural selection keys — but Up/Down still work too, same as every
    // other level, for consistency across the whole menu.
    if (e.key === "ArrowDown" || e.key === "ArrowRight") { sel = n ? (sel + 1) % n : 0; render(); }
    else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { sel = n ? (sel - 1 + n) % n : 0; render(); }
    else if (e.key === "Enter") choose();
    else if (e.key === "Escape") back();
    else if (e.key === "Backspace") { filter = filter.slice(0, -1); sel = 0; render(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      filter += e.key; sel = 0; render();
    }
    else return;
    e.preventDefault();
  });

  render();
</script>
