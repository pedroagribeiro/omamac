<style>
  :root {
    --bg: #1a1b26; --fg: #a9b1d6; --accent: #7aa2f7; --sel: #33467c;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 14px -apple-system, ui-sans-serif, system-ui;
    background: transparent; color: var(--fg);
    display: flex; align-items: center; justify-content: center; height: 100vh;
  }
  #card {
    width: 560px; max-height: 70vh; display: flex; flex-direction: column;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    border: 1px solid color-mix(in srgb, var(--fg) 20%, transparent);
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    backdrop-filter: blur(24px);
  }
  #head {
    display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px;
    border-bottom: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
  }
  #crumb { color: var(--accent); font-weight: 600; }
  #filter {
    flex: 1; border: 0; outline: 0; background: transparent;
    color: var(--fg); font: inherit;
  }
  #list { overflow-y: auto; padding: 6px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; cursor: default;
  }
  .row.on { background: var(--sel); }
  .row img { width: 64px; height: 36px; object-fit: cover; border-radius: 4px; }
  .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cur { color: var(--accent); font-size: 12px; }
  #hint {
    padding: 8px 16px; font-size: 11px; opacity: .5;
    border-top: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
  }
</style>

<div id="card">
  <div id="head"><span id="crumb">Style</span><input id="filter" placeholder="Filter…"></div>
  <div id="list"></div>
  <div id="hint">↑↓ navigate · ⏎ select · esc back</div>
</div>

<script>
  const DATA = window.OMAMAC || { theme: {}, font: {}, bg: {}, colors: {} };
  const send = (m) => window.webkit?.messageHandlers?.omamac?.postMessage(m);

  if (DATA.colors) {
    const r = document.documentElement.style;
    if (DATA.colors.background) r.setProperty("--bg", DATA.colors.background);
    if (DATA.colors.foreground) r.setProperty("--fg", DATA.colors.foreground);
    if (DATA.colors.accent) r.setProperty("--accent", DATA.colors.accent);
    if (DATA.colors.selection_background) r.setProperty("--sel", DATA.colors.selection_background);
  }

  const LEVELS = {
    root: { crumb: "Style", items: () => ["Theme", "Font", "Background"] },
    theme: { crumb: "Theme", cmd: "theme", items: () => DATA.theme.options || [],
             current: () => DATA.theme.current },
    font: { crumb: "Font", cmd: "font", items: () => DATA.font.options || [],
            current: () => DATA.font.current },
    bg: { crumb: "Background", cmd: "bg", items: () => DATA.bg.options || [],
          current: () => (DATA.bg.current || "").split("/").pop(), preview: true },
  };

  let level = "root", sel = 0, filter = "";
  const thumbs = {};                       // basename -> data URI, filled by the host
  const el = { crumb: crumb, list: list, filter: document.getElementById("filter") };

  const visible = () => {
    const L = LEVELS[level], f = filter.toLowerCase();
    return L.items().filter((i) => i.toLowerCase().includes(f));
  };

  function render() {
    const L = LEVELS[level], items = visible(), cur = L.current?.();
    el.crumb.textContent = L.crumb;
    el.list.innerHTML = "";
    items.forEach((name, i) => {
      const row = document.createElement("div");
      row.className = "row" + (i === sel ? " on" : "");
      if (L.preview) {
        const img = document.createElement("img");
        if (thumbs[name]) img.src = thumbs[name];
        else send({ action: "preview", name });   // lazy: host pushes it back
        row.append(img);
      }
      const n = document.createElement("span");
      n.className = "name"; n.textContent = name; row.append(n);
      if (name === cur) {
        const c = document.createElement("span");
        c.className = "cur"; c.textContent = "current"; row.append(c);
      }
      row.onclick = () => { sel = i; choose(); };
      el.list.append(row);
    });
    el.list.children[sel]?.scrollIntoView({ block: "nearest" });
  }

  // The host calls this when a thumbnail finishes generating.
  window.omamacSetPreview = (name, uri) => { thumbs[name] = uri; render(); };

  function choose() {
    const items = visible();
    if (!items.length) return;
    const pick = items[sel];
    if (level === "root") {
      level = { Theme: "theme", Font: "font", Background: "bg" }[pick];
      sel = 0; filter = ""; el.filter.value = ""; render();
    } else {
      send({ action: "apply", cmd: LEVELS[level].cmd, arg: pick });
    }
  }

  function back() {
    if (level === "root") return send({ action: "close" });
    level = "root"; sel = 0; filter = ""; el.filter.value = ""; render();
  }

  document.addEventListener("keydown", (e) => {
    const n = visible().length;
    if (e.key === "ArrowDown") { sel = n ? (sel + 1) % n : 0; render(); }
    else if (e.key === "ArrowUp") { sel = n ? (sel - 1 + n) % n : 0; render(); }
    else if (e.key === "Enter") choose();
    else if (e.key === "Escape") back();
    else return;
    e.preventDefault();
  });

  el.filter.addEventListener("input", (e) => {
    filter = e.target.value; sel = 0; render();
  });

  el.filter.focus();
  render();
</script>
