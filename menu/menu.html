<style>
  :root {
    --bg: #1a1b26; --fg: #a9b1d6; --accent: #7aa2f7;
    /* Omarchy renders the menu in the system monospace font — the same one
       the active theme sets. This is only a fallback for when font.current
       is empty; the script below overrides it with the real theme font. */
    --font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* Omarchy exposes ONE cornerRadius token, shared by the card and its rows,
       and Style.qml declares it 0 by default (on Linux it mirrors Hyprland's
       decoration:rounding). Square is therefore the faithful default. Set this
       to e.g. 8px if you prefer rounded corners — both follow together. */
    --radius: 0px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-family);
    font-size: 14px;
    color: var(--fg);
    /* Full-viewport scrim behind everything: theme background at 50% alpha. */
    background: color-mix(in srgb, var(--bg) 50%, transparent);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #card {
    width: 300px;
    /* Fully opaque — no blur, no translucency. */
    background: var(--bg);
    border: 1px solid var(--fg);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #hdr {
    height: 34px;
    display: flex;
    align-items: center;
    font-size: 16px;
    background: transparent;
    opacity: .58;                 /* placeholder: "<Level>…" */
  }
  #hdr.typed { opacity: 1; }      /* once the user has typed something */
  #list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow-y: auto;
    /* Not part of the spec values — needed so a long list (e.g. 22 themes)
       doesn't push the card off-screen; the card itself has no max-height
       in the source values given. */
    max-height: min(60vh, 400px);
  }
  .row {
    display: flex;
    align-items: center;
    height: 50px;
    border-radius: var(--radius);
    cursor: default;
    color: var(--fg);
  }
  .row.on {
    background: color-mix(in srgb, var(--fg) 8%, transparent);
    color: var(--accent);         /* icon + label both pick this up via currentColor */
  }
  .icon {
    width: 36px; flex: 0 0 36px;
    margin-left: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    line-height: 1;
  }
  .name {
    flex: 1; min-width: 0;
    font-size: 16px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-right: 10px;
  }
  #card[hidden] { display: none; }

  /* Background level only: a coverflow, not the 300px card. Omarchy opens
     its background picker as its own much-wider panel — see
     ImagePicker.qml (v4.0.2) — so a different layout at this level is
     faithful, not inconsistent. Values below are lifted verbatim from that
     source: expandedWidth/Height 768x475, sliceWidth/Height 108x432,
     sliceSpacing -30 (the item overlap), skewOffset 28 (the parallelogram
     cut), bottomChromeHeight 30 (with showLabels/filterable both false,
     which are that component's defaults). One deviation, and it's
     deliberate: the source has NO `Behavior on width` or any animation
     anywhere in ImagePicker.qml — x/width/height/y are plain bindings, so
     the real picker SNAPS between slice and expanded size with no easing.
     This matches that: no transition is added here.
  */
  #cv {
    display: none;
    width: 100%; height: 100%;
    align-items: center;
    justify-content: center;
    /* bottomChromeHeight: empty space below the strip. */
    padding-bottom: 30px;
  }
  #cv:not([hidden]) { display: flex; }
  .cv {
    position: relative;
    flex: 0 0 auto;
    width: 108px;
    height: 432px;
    /* skewOffset: 28 -> top-left x=28, top-right x=100%, bottom-right
       x=100%-28, bottom-left x=0. Same parallelogram on every item,
       expanded or not. */
    clip-path: polygon(28px 0, 100% 0, calc(100% - 28px) 100%, 0 100%);
    cursor: default;
    /* Border, ImagePicker.qml (v4.0.2) verbatim: strokeWidth 1/3px,
       strokeColor foreground-at-28%/accent for unselected/selected. A plain
       CSS `border` would be sliced off at the slanted edges by the
       clip-path above, so instead this element's own background stands in
       for the stroke: --s is the thickness, and .cv-inner (below) clips to
       the same parallelogram inset by --s on every edge, leaving exactly
       that margin of this background visible as a uniform-width outline. */
    --s: 1px;
    background: color-mix(in srgb, var(--fg) 28%, transparent);
  }
  /* sliceSpacing: -30, applied uniformly (even against the expanded item —
     the source uses the same constant on both sides of it). */
  .cv:not(:first-child) { margin-left: -30px; }
  .cv.on {
    width: 768px;
    height: 475px;
    z-index: 1;
    --s: 3px;
    background: var(--accent);
  }
  .cv-inner {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    /* Same parallelogram as .cv, inset by --s on every edge — the visible
       gap between this clip and .cv's own is the stroke. The skew is only
       28px across a 432–475px height, so insetting both axes by the same
       --s keeps the perpendicular thickness close enough to uniform that
       the discrepancy isn't visible. */
    clip-path: polygon(
      calc(28px + var(--s)) var(--s),
      calc(100% - var(--s)) var(--s),
      calc(100% - 28px - var(--s)) calc(100% - var(--s)),
      var(--s) calc(100% - var(--s))
    );
    /* Neutral placeholder until a data URI arrives — never a broken-image
       box. Lives here (not on .cv) so an item awaiting its preview still
       shows a bordered frame instead of a solid block. */
    background: color-mix(in srgb, var(--fg) 15%, transparent);
  }
  .cv-img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
  }
</style>

<div id="card">
  <div id="hdr"></div>
  <div id="list"></div>
</div>
<div id="cv" hidden></div>

<script>
  const DATA = window.OMAMAC || { theme: {}, font: {}, bg: {}, colors: {} };
  const send = (m) => window.webkit?.messageHandlers?.omamac?.postMessage(m);

  if (DATA.colors) {
    const r = document.documentElement.style;
    if (DATA.colors.background) r.setProperty("--bg", DATA.colors.background);
    if (DATA.colors.foreground) r.setProperty("--fg", DATA.colors.foreground);
    if (DATA.colors.accent) r.setProperty("--accent", DATA.colors.accent);
  }

  // Render in whatever monospace font the user has chosen, same as Omarchy.
  // Falls back to a system monospace stack when font.current is empty; the
  // Nerd Font glyphs below simply won't render in that case, which is
  // acceptable and must not break layout.
  if (DATA.font && DATA.font.current) {
    document.documentElement.style.setProperty(
      "--font-family",
      `"${DATA.font.current}", ui-monospace, SFMono-Regular, Menlo, monospace`
    );
  }

  // Nerd Font glyphs for the root-level rows. Sourced verbatim from
  // omarchy v4.0.2's own menu definition
  // (default/omarchy/omarchy-menu.jsonc), stored as \u{} escapes rather
  // than literal PUA characters so a future edit/copy cannot silently
  // blank them (that's exactly what happened to the Font and marker
  // glyphs when they were first typed as literals here). Omarchy also
  // defines U+EBCF for the "Style" parent entry — unused here, since our
  // root level *is* that Style submenu.
  const ROOT_ICONS = { Theme: "\u{f0e0c}", Font: "\u{e659}", Background: "\u{f03e}" };

  const LEVELS = {
    root: { crumb: "Go", items: () => ["Theme", "Font", "Background"] },
    theme: { crumb: "Theme", cmd: "theme", items: () => DATA.theme.options || [] },
    font: { crumb: "Font", cmd: "font", items: () => DATA.font.options || [] },
    bg: { crumb: "Background", cmd: "bg", items: () => DATA.bg.options || [] },
  };

  let level = "root", sel = 0, filter = "";
  const thumbs = {};                       // basename -> data URI, filled by the host
  const requested = new Set();             // names already asked for a preview, so
                                            // render()/omamacSetPreview() re-runs
                                            // never re-send for the same name
  const attempts = {};                     // basename -> preview requests sent so far,
                                            // so a wallpaper whose preview keeps coming
                                            // back empty (still downloading, or genuinely
                                            // broken — see omamacSetPreview below) gets a
                                            // bounded retry instead of hammering the host
                                            // forever.
  const MAX_PREVIEW_ATTEMPTS = 2;
  const el = { hdr: hdr, list: list, card: card, cv: cv };

  const visible = () => {
    const L = LEVELS[level], f = filter.toLowerCase();
    return L.items().filter((i) => i.toLowerCase().includes(f));
  };

  // Lazily ask the host for a preview, at most once per name. Shared by
  // renderList (unused for previews today, since only Background has any)
  // and renderCoverflow, and guarded on `requested` so a re-render — every
  // keystroke, every omamacSetPreview callback — never re-sends for a name
  // that's already in flight. Without this it's O(N^2) sips spawns, several
  // racing to write the same --out path at once.
  function requestPreview(name) {
    if (thumbs[name] || requested.has(name)) return;
    if ((attempts[name] || 0) >= MAX_PREVIEW_ATTEMPTS) return;
    attempts[name] = (attempts[name] || 0) + 1;
    requested.add(name);
    send({ action: "preview", name });
  }

  function renderList(items) {
    el.list.innerHTML = "";
    items.forEach((name, i) => {
      const row = document.createElement("div");
      row.className = "row" + (i === sel ? " on" : "");

      const icon = document.createElement("div");
      icon.className = "icon";
      if (level === "root") icon.textContent = ROOT_ICONS[name] || "";
      row.append(icon);

      const n = document.createElement("span");
      n.className = "name"; n.textContent = name; row.append(n);

      row.onclick = () => { sel = i; choose(); };
      el.list.append(row);
    });
    el.list.children[sel]?.scrollIntoView({ block: "nearest" });
  }

  // Background level only: Omarchy's coverflow (ImagePicker.qml v4.0.2),
  // not the 300px card — see the #cv rule in <style> for the geometry this
  // mirrors. Every item gets the same clip-path parallelogram; the selected
  // one alone expands from a 108x432 slice to the full 768x475 image.
  function renderCoverflow(items) {
    el.cv.innerHTML = "";
    items.forEach((name, i) => {
      const item = document.createElement("div");
      item.className = "cv" + (i === sel ? " on" : "");

      // .cv-inner carries the image (or the neutral placeholder, via its
      // own CSS background) clipped inset from .cv's parallelogram by the
      // border thickness — see the .cv/.cv-inner rules in <style>.
      const inner = document.createElement("div");
      inner.className = "cv-inner";

      if (thumbs[name]) {
        const img = document.createElement("img");
        img.className = "cv-img";
        img.src = thumbs[name];
        inner.append(img);
      } else {
        // Neutral placeholder (the .cv-inner background) — never a broken
        // <img>: no src is set until a data URI actually arrives.
        requestPreview(name);
      }
      item.append(inner);

      // Matches ImagePicker.qml's MouseArea exactly: clicking the item
      // that's already centred applies it; clicking any other slides it
      // into the centre first, same as Left/Right/Enter would.
      item.onclick = () => { if (i === sel) choose(); else { sel = i; render(); } };
      el.cv.append(item);
    });
  }

  function render() {
    const L = LEVELS[level], items = visible();
    // No separate input box: the header line doubles as the search display.
    // Empty filter shows "<Level>…" dimmed; typing shows the typed text at
    // full opacity.
    el.hdr.textContent = filter ? filter : (L.crumb + "…");
    el.hdr.className = filter ? "typed" : "";

    if (level === "bg") {
      el.card.hidden = true;
      el.cv.hidden = false;
      renderCoverflow(items);
    } else {
      el.card.hidden = false;
      el.cv.hidden = true;
      renderList(items);
    }
  }

  // The host calls this when a thumbnail finishes generating — or, per the
  // coverflow-picker bug report, with uri === "" when omamac-preview came
  // back empty (source still downloading, missing, or unreadable). An empty
  // uri must NOT be cached: `thumbs[name] = ""` would make renderCoverflow's
  // `if (thumbs[name])` check falsy anyway (so no <img src=""> ever
  // renders), but it would also satisfy requestPreview's `thumbs[name] ||`
  // guard as a truthy-looking "already handled" entry via `in`/hasOwnProperty
  // semantics if that guard ever changed — so just never write it. Instead,
  // drop `name` from `requested` so the next render() naturally asks again;
  // requestPreview's own MAX_PREVIEW_ATTEMPTS cap is what stops this from
  // looping forever on a wallpaper that is never coming.
  window.omamacSetPreview = (name, uri) => {
    if (uri) {
      thumbs[name] = uri;
    } else {
      requested.delete(name);
    }
    render();
  };

  function choose() {
    const items = visible();
    if (!items.length) return;
    const pick = items[sel];
    if (level === "root") {
      level = { Theme: "theme", Font: "font", Background: "bg" }[pick];
      sel = 0; filter = ""; render();
    } else {
      send({ action: "apply", cmd: LEVELS[level].cmd, arg: pick });
    }
  }

  function back() {
    if (level === "root") return send({ action: "close" });
    level = "root"; sel = 0; filter = ""; render();
  }

  document.addEventListener("keydown", (e) => {
    const n = visible().length;
    // Background is a horizontal coverflow, so Left/Right are its natural
    // selection keys — but Up/Down still work too, same as every other
    // level, for consistency across the whole menu.
    if (e.key === "ArrowDown" || e.key === "ArrowRight") { sel = n ? (sel + 1) % n : 0; render(); }
    else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { sel = n ? (sel - 1 + n) % n : 0; render(); }
    else if (e.key === "Enter") choose();
    else if (e.key === "Escape") back();
    else if (e.key === "Backspace") { filter = filter.slice(0, -1); sel = 0; render(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      filter += e.key; sel = 0; render();
    }
    else return;
    e.preventDefault();
  });

  render();
</script>
